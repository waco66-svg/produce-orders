name: Refresh order pages
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pages from the data feed
        run: python3 build.py
      - name: Commit if anything changed
        run: |
          git config user.name "refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Refresh order pages" && git push)
