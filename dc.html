function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function tryOpen(code,silent){
  code=(code||"").trim().toLowerCase();
  if(!code)return false;
  try{
    const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:"SHA-256"},
      km,{name:"AES-GCM",length:256},false,["decrypt"]);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.ct));
    try{localStorage.setItem("orderPageCode",code)}catch(e){}
    const html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
    return true;
  }catch(e){
    if(!silent)document.getElementById("err").textContent="That code didn't work - check with Matthew.";
    return false;
  }
}
document.getElementById("go").onclick=()=>tryOpen(document.getElementById("pc").value,false);
document.getElementById("pc").addEventListener("keydown",e=>{if(e.key==="Enter")tryOpen(e.target.value,false)});
(function(){let c=null;try{c=localStorage.getItem("orderPageCode")}catch(e){}
 if(c)tryOpen(c,true)})();
</script></body></html>
